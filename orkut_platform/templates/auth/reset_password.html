{% extends 'base.html' %}

{% block title %}orkut - reset password{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="orkut-card shadow">
                <div class="orkut-card-header">
                    <span><i class="fas fa-key me-1"></i> Reset Password for @{{ target_user.username }}</span>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">New Password</label>
                        <input type="password" name="password" class="form-control" placeholder="New password" required minlength="6">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required minlength="6">
                    </div>

                    <div class="d-grid mb-2">
                        <button type="submit" class="btn btn-orkut py-2">
                            <i class="fas fa-check-circle me-1"></i> Update Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
