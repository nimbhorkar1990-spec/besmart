{% extends 'base.html' %}

{% block title %}orkut - forgot password{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="orkut-card shadow">
                <div class="orkut-card-header">
                    <span><i class="fas fa-question-circle me-1"></i> Forgot Password</span>
                    <a href="{% url 'login' %}" class="small text-decoration-none">Back to Login</a>
                </div>

                <p class="text-muted small mb-3">
                    Enter your registered email address to reset your account password.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your registered email" required autofocus>
                    </div>

                    <div class="d-grid mb-2">
                        <button type="submit" class="btn btn-orkut py-2">
                            <i class="fas fa-key me-1"></i> Send Reset Link
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
