{% extends 'base.html' %}

{% block title %}orkut - create community{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="orkut-card">
                <div class="orkut-card-header">
                    <span><i class="fas fa-plus-circle me-1 text-primary"></i> Create a New Community</span>
                    <a href="{% url 'communities_list' %}" class="small text-decoration-none">Back to Communities</a>
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Community Name *</label>
                        {{ form.name }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Category</label>
                        {{ form.category }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Description *</label>
                        {{ form.description }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Community Logo / Profile Picture</label>
                        {{ form.profile_picture }}
                    </div>

                    <div class="form-check mb-4">
                        {{ form.is_private }}
                        <label class="form-check-label small fw-semibold" for="{{ form.is_private.id_for_label }}">
                            Make this a Private Community (Requires owner approval for members to join)
                        </label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'communities_list' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                        <button type="submit" class="btn btn-orkut px-4 py-2">
                            <i class="fas fa-check me-1"></i> Create Community
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
