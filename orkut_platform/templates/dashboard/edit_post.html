{% extends 'base.html' %}

{% block title %}orkut - edit status{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="orkut-card">
                <div class="orkut-card-header">
                    <span><i class="fas fa-pencil me-1 text-primary"></i> Edit Status Update</span>
                    <a href="{% url 'home' %}" class="small text-decoration-none">Back to Home</a>
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Update Content:</label>
                        {{ form.content }}
                    </div>

                    {% if post.image %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Current Photo:</label>
                        <div>
                            <img src="{{ post.image.url }}" alt="photo" class="img-thumbnail" style="max-height: 180px;">
                        </div>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Change Photo (Optional):</label>
                        {{ form.image }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Link URL:</label>
                        {{ form.link_url }}
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                        <button type="submit" class="btn btn-orkut btn-sm px-3">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
