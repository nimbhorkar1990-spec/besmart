{% extends 'base.html' %}

{% block title %}Reset Password - SmartSearch Social{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card-social p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="bg-success-subtle text-success rounded-circle p-3 d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="fas fa-shield-halved fa-xl"></i>
                    </span>
                    <h3 class="fw-bold mb-1">Set New Password</h3>
                    <p class="text-muted small">Choose a strong, secure password for your account.</p>
                </div>

                <form method="post" action="{% url 'reset_password' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Your username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">New Password</label>
                        <input type="password" name="new_password" class="form-control" placeholder="At least 6 characters" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary rounded-pill fw-semibold py-2">
                            Update Password
                        </button>
                    </div>

                    <div class="text-center small">
                        <a href="{% url 'login' %}" class="text-decoration-none">Back to Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
