{% extends 'base.html' %}

{% block title %}Forgot Password - SmartSearch Social{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card-social p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="bg-primary-subtle text-primary rounded-circle p-3 d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="fas fa-lock fa-xl"></i>
                    </span>
                    <h3 class="fw-bold mb-1">Forgot Password</h3>
                    <p class="text-muted small">Enter your registered email address and we will assist with resetting your password.</p>
                </div>

                <form method="post" action="{% url 'forgot_password' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-lg" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary rounded-pill fw-semibold py-2">
                            Send Reset Instructions
                        </button>
                    </div>

                    <div class="text-center small">
                        <a href="{% url 'login' %}" class="text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Back to Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
