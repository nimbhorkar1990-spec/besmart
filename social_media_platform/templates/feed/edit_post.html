{% extends 'base.html' %}

{% block title %}Edit Post - SmartSearch Social{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card-social p-4">
                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                    <h5 class="fw-bold mb-0"><i class="fas fa-pen-to-square text-primary me-2"></i>Edit Post</h5>
                    <a href="{% url 'post_detail' post_id=post.id %}" class="btn-close" aria-label="Close"></a>
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Post Content</label>
                        {{ form.content }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Link URL</label>
                        {{ form.link_url }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Audience / Visibility</label>
                        {{ form.visibility }}
                    </div>

                    {% if post.image %}
                    <div class="mb-3">
                        <div class="small fw-semibold mb-1">Current Image:</div>
                        <img src="{{ post.image.url }}" alt="Current media" class="img-thumbnail" style="max-height: 180px;">
                    </div>
                    {% endif %}

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Replace Photo</label>
                        <input type="file" name="image" accept="image/*" class="form-control">
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'post_detail' post_id=post.id %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold shadow-sm">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
