spring.application.name=SmartSearch
server.port=8080

# Database Configuration (Embedded in-memory H2 database for instant zero-dependency run)
# Run with --spring.profiles.active=mysql to use MySQL
spring.datasource.url=jdbc:h2:mem:smartsearch_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Disabled by default in production; enable locally for debugging)
spring.h2.console.enabled=false

# Lucene Index Directory
smartsearch.lucene.index-dir=data/lucene_index

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Upload & File Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.smartsearch=INFO
logging.level.org.springframework.security=WARN

# Error Handling
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.path=/error

# Access Logging (Logs every HTTP request with path and response code)
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%t "%r" %s %b (%D ms)
