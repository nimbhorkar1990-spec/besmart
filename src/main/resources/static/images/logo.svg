<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="50%" stop-color="#2b7de9" />
      <stop offset="100%" stop-color="#0b57d0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4335" />
      <stop offset="35%" stop-color="#fbbc05" />
      <stop offset="70%" stop-color="#34a853" />
      <stop offset="100%" stop-color="#1a73e8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon: Modern Search Scope & Spark -->
  <g transform="translate(15, 12)">
    <!-- Outer Glow Ring -->
    <circle cx="36" cy="36" r="28" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Inner Optics -->
    <circle cx="36" cy="36" r="16" fill="#e8f0fe" opacity="0.6" />
    <circle cx="32" cy="32" r="6" fill="#ffffff" opacity="0.8" />
    <!-- Handle -->
    <line x1="56" y1="56" x2="72" y2="72" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Pulse Spark -->
    <circle cx="48" cy="24" r="4" fill="#34a853" />
    <path d="M 48 16 L 48 32 M 40 24 L 56 24" stroke="#34a853" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="105" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="800" fill="#202124" letter-spacing="-1">
    Smart<tspan fill="url(#primaryGrad)">Search</tspan>
  </text>
  <text x="108" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#5f6368" letter-spacing="2.5">
    DISCOVER FASTER
  </text>
</svg>

