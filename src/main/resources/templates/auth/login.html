<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/header :: head('Log In - SmartSearch')}">
</head>
<body class="bg-body-tertiary">

<!-- Simple Top Header -->
<header class="py-3 px-4 border-bottom bg-body">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="text-decoration-none">
            <img th:src="@{/images/logo.svg}" alt="SmartSearch" height="34">
        </a>
        <div th:replace="~{fragments/header :: themeSelector}"></div>
    </div>
</header>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <!-- Login Card -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-body p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <img th:src="@{/images/logo-icon.svg}" alt="Icon" width="48" height="48" class="mb-2">
                        <h3 class="fw-bold">Sign In</h3>
                        <p class="text-muted small">to continue to SmartSearch</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small rounded-3" th:text="${errorMessage}">
                        Error message
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 px-3 small rounded-3" th:text="${successMessage}">
                        Success message
                    </div>

                    <form th:action="@{/login}" method="post">
                        <!-- Username / Email -->
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-body-tertiary"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="username" name="username" class="form-control" placeholder="admin or username" required autofocus>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label small fw-semibold">Password</label>
                                <a th:href="@{/forgot-password}" class="small text-muted text-decoration-none">Forgot password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-body-tertiary"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <!-- Remember Me -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                            <label class="form-check-label small" for="remember-me">
                                Stay signed in for 14 days
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold">
                            Sign In
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Card -->
                    <div class="bg-body-tertiary rounded-3 p-3 mt-4 border">
                        <div class="fw-bold small text-primary mb-1">
                            <i class="fas fa-key me-1"></i> Quick Demo Accounts:
                        </div>
                        <div class="small text-muted mb-1">
                            <strong>Admin:</strong> <code>admin</code> / <code>Admin@123</code>
                        </div>
                        <div class="small text-muted">
                            <strong>User:</strong> <code>demo</code> / <code>Demo@123</code>
                        </div>
                    </div>

                    <div class="text-center mt-4 pt-2 border-top">
                        <span class="text-muted small">Don't have an account?</span>
                        <a th:href="@{/register}" class="small fw-semibold ms-1">Create account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
