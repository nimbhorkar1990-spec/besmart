<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SmartSearch</title>
    
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo-icon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <link rel="stylesheet" th:href="@{/css/themes.css}">
</head>
<body class="bg-body-tertiary">

<header class="py-3 px-4 border-bottom bg-body">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="text-decoration-none">
            <img th:src="@{/images/logo.svg}" alt="SmartSearch" height="34">
        </a>
        <div th:replace="~{fragments/header :: themeSelector}"></div>
    </div>
</header>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-body p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <img th:src="@{/images/logo-icon.svg}" alt="Icon" width="48" height="48" class="mb-2">
                        <h3 class="fw-bold">Forgot Password</h3>
                        <p class="text-muted small">Enter your email or username to reset your password</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small rounded-3" th:text="${errorMessage}">
                        Error message
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 px-3 small rounded-3" th:text="${successMessage}">
                        Success message
                    </div>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-4">
                            <label for="identifier" class="form-label small fw-semibold">Username or Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-body-tertiary"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="text" id="identifier" name="identifier" class="form-control" placeholder="user@example.com" required autofocus>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold">
                            Send Reset Instructions
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top">
                        <a th:href="@{/login}" class="small fw-semibold text-decoration-none">
                            <i class="fas fa-arrow-left me-1"></i>Back to Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="smart-footer mt-auto">
    <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-3">
            <span>Powered by <strong>SmartSearch</strong></span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/}" class="text-decoration-none">Home</a>
            <a th:href="@{/login}" class="text-decoration-none">Sign In</a>
            <span class="text-muted">&copy; 2026 SmartSearch Inc.</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
