<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/header :: head('Search History - SmartSearch')}">
</head>
<body class="bg-body-tertiary">

<header th:replace="~{fragments/header :: navbar}"></header>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <!-- Header Row -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-history text-primary me-2"></i>Your Search History</h3>
                    <p class="text-muted small mb-0">Search queries previously executed from your account</p>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <form th:if="${historyPage.totalElements > 0}" th:action="@{/user/history/clear}" method="post" 
                          onsubmit="return confirm('Are you sure you want to permanently clear all search history?');">
                        <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                            <i class="fas fa-trash-alt me-1"></i> Clear All History
                        </button>
                    </form>
                </div>
            </div>

            <!-- Search Filter Bar -->
            <div class="card shadow-sm border-0 rounded-4 mb-4">
                <div class="card-body p-3">
                    <form th:action="@{/user/history}" method="get" class="d-flex gap-2">
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" name="query" class="form-control border-start-0" 
                                   th:value="${query}" placeholder="Filter your search history...">
                        </div>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Filter</button>
                        <a th:if="${query != ''}" th:href="@{/user/history}" class="btn btn-outline-secondary rounded-pill px-3">Reset</a>
                    </form>
                </div>
            </div>

            <!-- Alerts -->
            <div th:if="${successMessage}" class="alert alert-success py-2 px-3 small rounded-3 mb-4" th:text="${successMessage}">
                Success message
            </div>

            <!-- History Entries -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="list-group list-group-flush" th:if="${historyPage.totalElements > 0}">
                    <div th:each="item : ${historyPage.content}" 
                         class="list-group-item p-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-3">
                            <span class="badge bg-primary-subtle text-primary" th:text="${item.category}">ALL</span>
                            <div>
                                <a th:href="@{/search(q=${item.query}, category=${item.category})}" 
                                   class="fw-semibold text-body text-decoration-none fs-6">
                                    <span th:text="${item.query}">Query</span>
                                </a>
                                <div class="text-muted small" th:text="${#temporals.format(item.searchedAt, 'MMM dd, yyyy HH:mm')}">
                                    Date
                                </div>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-2">
                            <a th:href="@{/search(q=${item.query}, category=${item.category})}" 
                               class="btn btn-outline-primary btn-sm rounded-pill px-3">
                                <i class="fas fa-magnifying-glass me-1"></i> Search Again
                            </a>
                            <form th:action="@{/user/history/delete}" method="post" class="m-0">
                                <input type="hidden" name="id" th:value="${item.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-circle p-2" title="Delete entry">
                                    <i class="fas fa-times"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div th:if="${historyPage.totalElements == 0}" class="text-center py-5">
                    <div class="text-muted mb-2 fs-1"><i class="fas fa-clock-rotate-left"></i></div>
                    <h5 class="fw-semibold">No search history found</h5>
                    <p class="text-muted small">Your search queries will be saved here when logged in.</p>
                    <a th:href="@{/}" class="btn btn-primary btn-sm rounded-pill px-4 mt-2">Start Searching</a>
                </div>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-center mt-4" th:if="${historyPage.totalPages > 1}">
                <nav class="smart-pagination">
                    <a th:if="${historyPage.hasPrevious()}" 
                       th:href="@{/user/history(page=${currentPage - 1}, query=${query})}" 
                       class="page-btn"><i class="fas fa-chevron-left"></i></a>

                    <a th:each="p : ${#numbers.sequence(1, historyPage.totalPages)}" 
                       th:href="@{/user/history(page=${p}, query=${query})}" 
                       class="page-btn" 
                       th:classappend="${p == currentPage} ? 'active' : ''" 
                       th:text="${p}">1</a>

                    <a th:if="${historyPage.hasNext()}" 
                       th:href="@{/user/history(page=${currentPage + 1}, query=${query})}" 
                       class="page-btn"><i class="fas fa-chevron-right"></i></a>
                </nav>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
