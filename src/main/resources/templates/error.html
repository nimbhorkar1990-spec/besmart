<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle + ' - SmartSearch'}">Error - SmartSearch</title>
    
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo-icon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <link rel="stylesheet" th:href="@{/css/themes.css}">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

<!-- Header -->
<header class="py-3 px-4 border-bottom bg-body">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="text-decoration-none">
            <img th:src="@{/images/logo.svg}" alt="SmartSearch" height="34">
        </a>
        <div th:replace="~{fragments/header :: themeSelector}"></div>
    </div>
</header>

<!-- Main Error Container -->
<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <!-- Error Badge & Icon -->
            <div class="mb-4">
                <span class="display-1 fw-bold text-primary" th:text="${statusCode}">404</span>
                <div class="mt-2 text-secondary fs-3">
                    <i th:if="${statusCode == 404}" class="fas fa-compass text-primary"></i>
                    <i th:if="${statusCode == 403}" class="fas fa-lock text-warning"></i>
                    <i th:if="${statusCode == 500}" class="fas fa-triangle-exclamation text-danger"></i>
                </div>
            </div>

            <!-- Error Title & Message -->
            <h2 class="fw-bold mb-3" th:text="${errorTitle}">Page Not Found</h2>
            <p class="text-body-secondary lead mb-2" th:text="${errorMessage}">
                The page or resource you requested could not be found.
            </p>
            <p class="text-muted small mb-4" th:text="${errorHint}">
                Please check the URL or try searching from the homepage.
            </p>

            <!-- Inline Search Form -->
            <div class="searchbar-wrapper mx-auto mb-4" style="max-width: 480px;">
                <form th:action="@{/search}" method="get">
                    <div class="searchbar-box shadow-sm">
                        <i class="fas fa-search searchbar-icon"></i>
                        <input type="text" name="q" class="searchbar-input" placeholder="Search for something else..." autofocus>
                        <button type="submit" class="searchbar-action-btn text-primary">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a th:href="@{/}" class="btn btn-primary px-4 py-2 rounded-pill fw-medium">
                    <i class="fas fa-home me-2"></i>Go to Homepage
                </a>
                <a th:if="${statusCode == 403}" th:href="@{/login}" class="btn btn-outline-primary px-4 py-2 rounded-pill fw-medium">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In with Another Account
                </a>
                <button type="button" onclick="history.back();" class="btn btn-outline-secondary px-4 py-2 rounded-pill fw-medium">
                    <i class="fas fa-arrow-left me-2"></i>Go Back
                </button>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="smart-footer mt-auto">
    <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-3">
            <span><i class="fas fa-globe-americas me-1 text-primary"></i> SmartSearch Help</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/}" class="text-decoration-none">Search</a>
            <a th:href="@{/login}" class="text-decoration-none">Sign In</a>
            <span class="text-muted">&copy; 2026 SmartSearch Inc.</span>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
