<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/header :: head('Social Media Platform - SmartSearch')}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header Navbar with Home & Services Navigation Menu -->
<header th:replace="~{fragments/header :: navbar}"></header>

<!-- Main Container -->
<main class="flex-grow-1 py-5 bg-body-tertiary">
    <div class="container text-center py-5">
        <div class="p-4 p-md-5 bg-white rounded-4 shadow-sm border d-inline-block text-start" style="max-width: 650px;">
            <div class="d-flex align-items-center gap-3 mb-3">
                <span class="bg-primary text-white rounded-3 p-2 px-3 fs-3">
                    <i class="fas fa-share-nodes"></i>
                </span>
                <div>
                    <h3 class="fw-bold mb-0">SmartSearch Social Media Platform</h3>
                    <div class="text-muted small">Modern Python &amp; Django Networking Service</div>
                </div>
            </div>
            <p class="text-secondary mb-4">
                You are being redirected to our dedicated social networking application. Connect with fellow developers, publish articles and engage in real-time messaging.
            </p>
            <div class="d-flex gap-2">
                <a href="http://localhost:8000/" class="btn btn-primary rounded-pill px-4 fw-semibold shadow-sm">
                    <i class="fas fa-arrow-up-right-from-square me-2"></i>Open Social Media Platform
                </a>
                <a th:href="@{/}" class="btn btn-outline-secondary rounded-pill px-3">Back to Search</a>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

<script>
    setTimeout(function() {
        window.location.href = "http://localhost:8000/";
    }, 1200);
</script>

</body>
</html>
