# MySQL Profile Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smartsearch_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

smartsearch.lucene.index-dir=data/lucene_index
spring.thymeleaf.cache=false

